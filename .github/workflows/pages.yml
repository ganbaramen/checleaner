# Publishes the two phone pages to GitHub Pages over HTTPS: checleaner.html as
# the site root, and focusmerge.html alongside it. The single source of truth
# stays the files at the repo root; this only assembles them plus the PWA assets
# in web/ into the published site, so there is no second copy to keep in sync.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths: [checleaner.html, focusmerge.html, web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp checleaner.html _site/index.html
          cp focusmerge.html _site/focusmerge.html
          cp web/manifest.webmanifest web/sw.js _site/
          cp web/icon-192.png web/icon-512.png web/apple-touch-icon.png _site/
          # YuNet, MIT (Shiqi Yu), byte-identical to the model checleaner.py uses
          cp web/face_detection_yunet_2023mar.onnx _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
