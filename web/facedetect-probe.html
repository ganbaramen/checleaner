<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FaceDetector probe</title>
<!--
  A throwaway diagnostic, not part of the app. It answers one question before
  any work goes into next-steps item 1 (content reorientation in checleaner.html):
  can the browser's own FaceDetector do the job, with no model and no WASM to
  ship?

  What it has to establish, in order:

  1. Does `FaceDetector` exist at all, and does constructing one throw?
  2. Does it find faces in a *photo of photos*? A face inside one print of a
     six-print frame is maybe 60 px across at the app's analysis scale, which is
     a harder ask than the selfie case the API was built for. So it runs at both
     the analysis scale (1100 px long edge, what detectPrint sees) and at full
     resolution, to see whether scale is the deciding factor.
  3. **Does a detection carry a confidence?** This is the one that decides the
     design. checleaner.py's content_rotation() sums face *confidence* per turn
     and needs `min_score` 1.2 with a 1.5x margin before it will turn a frame --
     the whole point being that it must never turn a frame that was already
     right. The Shape Detection spec's DetectedFace has boundingBox and
     landmarks and no score, so if that holds we would be reduced to counting
     faces, which is a coarser signal needing its own calibration. The probe
     dumps a raw detection so this is observed rather than assumed.
  4. Is it fast enough on the phone, four turns per photo?

  Delete this file once the answer is written down.
-->
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 16px;
         max-width: 46rem; }
  h1 { font-size: 1.15rem; margin: 0 0 .75rem; }
  .verdict { padding: .6rem .8rem; border-radius: 8px; margin: .75rem 0;
             font-weight: 600; }
  .yes { background: #d8f5dd; color: #06400f; }
  .no  { background: #ffdcdc; color: #5d0000; }
  @media (prefers-color-scheme: dark) {
    .yes { background: #10391a; color: #b8f0c4; }
    .no  { background: #4a1414; color: #ffc9c9; }
  }
  table { border-collapse: collapse; margin: .5rem 0 1rem; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid #8886; padding: .25rem .6rem; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  pre { background: #8881; padding: .6rem; border-radius: 6px; overflow-x: auto;
        font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  #env { font-size: 13px; opacity: .8; }
  button, input[type=file] { font: inherit; margin: .3rem 0; }
</style>

<h1>FaceDetector probe</h1>
<div id="verdict" class="verdict">checking…</div>
<pre id="env"></pre>

<p><input type="file" id="pick" accept="image/*"></p>
<p id="status"></p>
<div id="out"></div>

<script>
const $ = id => document.getElementById(id);
const TURNS = [0, 90, 180, 270];

// ---------------------------------------------------------------- capability
const have = "FaceDetector" in window;
let detector = null, ctorError = null;
if (have) {
  try {
    // maxDetectedFaces generously: a six-print frame could hold a dozen.
    // fastMode off asks for accuracy over latency, which is the right trade
    // here -- this runs once per photo, not per video frame.
    detector = new FaceDetector({ fastMode: false, maxDetectedFaces: 32 });
  } catch (e) { ctorError = String(e); }
}
$("verdict").className = "verdict " + (detector ? "yes" : "no");
$("verdict").textContent = !have
  ? "FaceDetector is NOT available in this browser."
  : detector ? "FaceDetector is available. Pick a cheki photo to see if it can use it."
             : "FaceDetector exists but would not construct.";
$("env").textContent = [
  "FaceDetector in window : " + have,
  "constructed            : " + (detector ? "yes" : "no" + (ctorError ? " — " + ctorError : "")),
  "isSecureContext        : " + window.isSecureContext,
  "origin                 : " + location.origin,
  "devicePixelRatio       : " + window.devicePixelRatio,
  "hardwareConcurrency    : " + (navigator.hardwareConcurrency || "?"),
  "userAgent              : " + navigator.userAgent,
].join("\n");

// ----------------------------------------------------------------- rendering
/* The image drawn at `scale` and turned `deg` clockwise, as a canvas.
   Deliberately the *uncorrected* pixels: checleaner.py reads faces off the raw
   frame because pushing the whites to 238.8 first costs it detections. */
function frame(bitmap, scale, deg) {
  const w = Math.max(1, Math.round(bitmap.width * scale));
  const h = Math.max(1, Math.round(bitmap.height * scale));
  const swap = deg === 90 || deg === 270;
  const c = document.createElement("canvas");
  c.width = swap ? h : w;
  c.height = swap ? w : h;
  const g = c.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.translate(c.width / 2, c.height / 2);
  g.rotate(deg * Math.PI / 180);
  g.drawImage(bitmap, -w / 2, -h / 2, w, h);
  return c;
}

/* Everything a DetectedFace carries, including whatever the spec doesn't
   promise. Object.keys() misses accessors on the prototype, so walk that too --
   the question "is there a confidence anywhere on this object" is the one thing
   this probe exists to answer and it must not be answered by omission. */
function describe(face) {
  const out = {};
  for (const k in face) {
    const v = face[k];
    out[k] = (v && typeof v === "object" && typeof v.toJSON === "function")
             ? v.toJSON() : v;
  }
  const proto = Object.getPrototypeOf(face);
  out.__ownKeys = Object.keys(face);
  out.__protoKeys = proto ? Object.getOwnPropertyNames(proto) : [];
  return out;
}

// --------------------------------------------------------------------- run
$("pick").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file || !detector) return;
  $("out").innerHTML = "";
  $("status").textContent = "decoding…";

  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch (e) {
    $("status").textContent = "could not decode that image: " + e;
    return;
  }

  // 1100 on the long edge is what checleaner.html's detectPrint() works at, so
  // it is the scale a shipped implementation would most likely use. Full
  // resolution is the control: if faces only appear there, the cost of this
  // approach is running a detector on a 12 Mpx frame four times.
  const long = Math.max(bitmap.width, bitmap.height);
  const scales = [["analysis (1100 long edge)", 1100 / long], ["full resolution", 1]];

  const rows = [];
  let sample = null;
  for (const [label, scale] of scales) {
    for (const deg of TURNS) {
      $("status").textContent = `detecting — ${label}, ${deg}°…`;
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
      const canvas = frame(bitmap, scale, deg);
      const t0 = performance.now();
      let faces = [], err = null;
      try {
        faces = await detector.detect(canvas);
      } catch (e) { err = String(e); }
      const ms = Math.round(performance.now() - t0);
      rows.push({ label, deg, size: `${canvas.width}×${canvas.height}`,
                  n: err ? "error" : faces.length, ms, err });
      if (!sample && faces.length) sample = describe(faces[0]);
    }
  }

  const table = ["<table><tr><th>scale</th><th>turn</th><th>canvas</th>"
                 + "<th>faces</th><th>ms</th></tr>"];
  for (const r of rows)
    table.push(`<tr><td>${r.label}</td><td>${r.deg}°</td><td>${r.size}</td>`
             + `<td>${r.n}</td><td>${r.ms}</td></tr>`);
  table.push("</table>");

  const found = rows.some(r => typeof r.n === "number" && r.n > 0);
  const errs = rows.filter(r => r.err).map(r => r.err);
  let notes = "";
  if (!found) {
    notes = "<p><b>No faces found at any scale or turn.</b> If this photo does "
          + "hold recognisable faces, the API can't do this job.</p>";
  } else {
    const keys = sample ? sample.__protoKeys.concat(sample.__ownKeys).join(" ") : "";
    const scored = /score|confidence|probability/i.test(keys);
    notes = `<p><b>${scored ? "A confidence field is present"
                            : "No confidence field — counts only"}.</b> `
          + (scored ? "content_rotation()'s scoring maths ports directly."
                    : "checleaner.py sums face <i>confidence</i> per turn and "
                    + "needs a 1.5× margin before turning a frame. With counts "
                    + "alone that margin rule has to be re-derived, and the "
                    + "conservative bias it exists for is the whole point.")
          + "</p>";
  }
  if (errs.length) notes += `<pre>errors: ${errs.join("\n")}</pre>`;

  $("status").textContent = "done.";
  $("out").innerHTML = table.join("") + notes
    + "<p>First detection, every field:</p><pre>"
    + (sample ? JSON.stringify(sample, null, 2) : "(none found)") + "</pre>";
});
</script>
